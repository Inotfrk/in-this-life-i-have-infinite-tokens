version: '1.0'
name: release
displayName: develop 自动发布到 master

# 第二层 develop 每次推送后，测试通过即自动合并到第一层 master（AGENTS.md 第 8 节）。
# Gitee Go 需要在仓库里手动「一键开启」才会触发；未开启时用 scripts/release.ps1 / release.sh。
triggers:
  trigger: auto
  push:
    branches:
      exact:
        - develop
stages:
  - name: release
    displayName: 测试并发布
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: shell@agent
        name: promote
        displayName: 测试后推进 master
        commands:
          - apt-get update -y && apt-get install -y openjdk-21-jdk ca-certificates-java git
          - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          - export PATH=$JAVA_HOME/bin:$PATH
          - java -version
          - '# 构建机没有图形环境，界面测试会自动跳过'
          - bash scripts/build.sh test
          - 'git config user.name "gitee-go"'
          - 'git config user.email "gitee-go@noreply.gitee.com"'
          - 'git fetch origin develop master'
          - 'git checkout master'
          - 'git merge --no-ff origin/develop -m "release: 自动发布 develop -> master (gitee go)"'
          - 'git push origin master'
        notify: []
        strategy:
          retry: '0'
