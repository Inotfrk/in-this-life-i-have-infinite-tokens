version: '1.0'
name: package
displayName: 测试与跨平台 jar

# Gitee Go 的构建机是 Linux，jpackage 只能打当前系统的包，因此这里不产 dmg / msi：
# 在 Gitee 侧跑测试并归档可运行的 jar；
# macOS 的 .dmg 与 Windows 的 .exe / .msi 由 .github/workflows/package.yml 在原生 runner 上产出。
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - ''
stages:
  - name: test
    displayName: 测试
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: shell@agent
        name: run_tests
        displayName: 编译并运行测试
        commands:
          - apt-get update -y && apt-get install -y openjdk-21-jdk ca-certificates-java
          - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          - export PATH=$JAVA_HOME/bin:$PATH
          - java -version
          - '# 构建机没有图形环境，界面测试会自动跳过'
          - bash scripts/build.sh test
        notify: []
        strategy:
          retry: '0'

  - name: jar
    displayName: 跨平台 jar
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: shell@agent
        name: make_jar
        displayName: 生成 jar
        commands:
          - apt-get update -y && apt-get install -y openjdk-21-jdk ca-certificates-java
          - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          - export PATH=$JAVA_HOME/bin:$PATH
          - bash scripts/build.sh jar
        artifacts:
          - name: CALCULATOR_JAR
            path:
              - ./dist/Calculator.jar
        notify: []
        strategy:
          retry: '0'
      - step: publish@general_artifacts
        name: publish_jar
        displayName: 归档 jar
        dependArtifact: CALCULATOR_JAR
        artifactName: calculator-jar
        dependsOn: make_jar
        strategy:
          retry: '0'
