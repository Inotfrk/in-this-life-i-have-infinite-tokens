<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D 装机模拟器 · Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">▦</span>
      <span>装机工作台<small>PC BUILDER</small></span>
      <span class="tag">交互原型</span>
    </div>
    <div class="hint">拖部件到插槽附近 · 按住机箱里的部件可拖动/移出 · R 旋转 · 滚轮缩放</div>
    <div class="quick">
      <span class="fps" id="fpsChip">– fps</span>
      <span class="divider">·</span>
      <span id="quickStats">—</span>
    </div>
  </header>

  <main>
    <aside class="panel palette">
      <div class="panel-title"><span>硬件部件库</span><span class="section-index">01 / LIBRARY</span></div>
      <p class="panel-description">选厂商后把部件拖进机箱；装好的可以再拖出来。<br>缺前置条件也能放，只是标成「未生效」。</p>
      <div class="filters" id="filters"></div>
      <div class="parts" id="parts"></div>
    </aside>

    <section class="viewport" id="viewport" aria-label="三维装机工作区">
      <div class="stage-label"><span class="live-dot"></span> 装配视图 <small>REALTIME 3D</small></div>
      <div class="drop-hint" id="dropHint">把「机箱」拖进来开始装机</div>
      <div class="hud" id="hud" hidden>
        <div class="hud-row"><span class="hud-key">朝向</span><span id="hudOri">0°</span></div>
        <div class="hud-row"><span class="hud-key">对准</span><span id="hudAim">—</span></div>
        <div class="hud-tip">R 旋转 90° · 放歪就落在桌面/机箱底 · Esc 归位</div>
      </div>
      <div class="tutorial" id="tutorial" hidden aria-live="polite">
        <div class="tutorial-head">
          <span class="tutorial-kicker">🎓 硅脂教程</span>
          <span class="tutorial-progress" id="tutorialProgress">1 / 6</span>
          <button class="tutorial-close" id="tutorialClose" title="关闭教程">✕</button>
        </div>
        <h4 id="tutorialTitle"></h4>
        <p id="tutorialBody"></p>
        <p class="tutorial-tip" id="tutorialTip"></p>
        <div class="tutorial-dots" id="tutorialDots"></div>
        <div class="tutorial-actions">
          <button id="tutorialPrev">上一步</button>
          <button id="tutorialNext" class="primary">下一步</button>
        </div>
      </div>
      <div class="toolbar">
        <button id="btnTutorial" title="六步学会涂硅脂">🎓 硅脂教程</button>
        <button id="btnRotate" title="拖拽时旋转 90°（快捷键 R）">⟳ 旋转</button>
        <button id="btnView" title="恢复默认相机位置">↺ 重置视角</button>
        <button id="btnReset" title="移除所有已安装部件">清空配置</button>
        <button id="btnBoot" title="跑一遍开机自检">⚡ 开机自检</button>
        <button id="btnAuto" class="primary">＋ 示例装机</button>
      </div>
    </section>

    <aside class="panel inspector">
      <div class="panel-title"><span>配置概览</span><span class="section-index">02 / INSPECTOR</span></div>
      <div class="card" id="detailCard"></div>
      <div class="card" id="pasteCard"></div>
      <div class="card" id="thermalCard"></div>
      <div class="card" id="scoreCard"></div>
      <div class="card" id="bomCard"></div>
    </aside>
  </main>

  <!-- esbuild 打好的单文件包；file:// 下比裸 ES module 稳（不受模块 CORS 限制） -->
  <script defer src="../dist/app.js"></script>
</body>
</html>
