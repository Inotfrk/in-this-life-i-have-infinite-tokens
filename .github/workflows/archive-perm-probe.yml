name: archive-perm-probe

# 临时探针：验证 GitHub Actions 自带的 GITHUB_TOKEN 能否在 archive-owner-only 规则下
# 新建 archive/* 分支。验证完即删除。
on:
  push:
    branches:
      - inotfrk-Fairy-Main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Try creating archive branch with built-in token
        run: |
          set -euo pipefail
          git fetch origin master
          BRANCH="archive/probe-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH" --no-track origin/master
          echo "probe $GITHUB_RUN_ID" > PROBE.txt
          git add PROBE.txt
          git commit -m "chore: probe archive creation"
          if git push origin "HEAD:refs/heads/$BRANCH"; then
            echo "::notice::PROBE_RESULT=allowed"
          else
            echo "::error::PROBE_RESULT=denied"
            exit 1
          fi
