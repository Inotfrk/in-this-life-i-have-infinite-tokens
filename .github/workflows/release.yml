name: release

# 第二层 develop 每次推送后，测试通过即自动合并到第一层 master（AGENTS.md 第 8 节）。
# 推送即触发，不需要手动开启；本地等价脚本是 scripts/release.ps1 / scripts/release.sh。

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 同一条 develop 上的多次推送不并发发布，避免两个 run 同时改 master。
concurrency:
  group: release-develop
  cancel-in-progress: false

jobs:
  promote:
    name: promote develop -> master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests
        # 构建机没有图形环境，界面测试会自动跳过。
        run: bash scripts/build.sh test

      - name: Open and merge release pull request
        run: |
          set -euo pipefail
          git fetch origin develop master

          if git merge-base --is-ancestor origin/develop origin/master; then
            echo 'master 已包含 develop，无需发布'
            exit 0
          fi

          TAG="v$(date -u +%Y.%m.%d-%H%M)"
          BRANCH="release/develop-to-master-$TAG"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH" origin/develop
          git push origin "$BRANCH"

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "release: 自动发布 develop -> master ($TAG)" \
            --body "由 release workflow 自动创建。develop 已通过测试，合并到 master 后打标签 $TAG。"

          gh pr merge "$BRANCH" --merge --delete-branch
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Tag the release
        if: env.TAG != ''
        run: |
          set -euo pipefail
          git fetch origin master
          git tag -a "$TAG" -m "release $TAG" origin/master
          git push origin "$TAG"

      - name: Back-merge master into develop
        if: env.TAG != ''
        run: |
          set -euo pipefail
          # 合并提交只在 master 上，回合给 develop，否则下次比较会一直有偏移。
          git fetch origin develop master
          if git merge-base --is-ancestor origin/master origin/develop; then
            echo 'develop 已包含 master，无需回合'
            exit 0
          fi

          BRANCH="release/master-to-develop-$TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH" origin/develop
          # 必须真的把 master 合进来，否则新分支与 develop 无差异，PR 会因 No commits 失败。
          git merge --no-ff origin/master -m "release: 回合 master -> develop ($TAG)"
          git push origin "$BRANCH"

          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "release: 回合 master -> develop ($TAG)" \
            --body "自动发布产生的合并提交只存在于 master，这里回合到 develop，避免两层永久偏移。"

          gh pr merge "$BRANCH" --merge --delete-branch
