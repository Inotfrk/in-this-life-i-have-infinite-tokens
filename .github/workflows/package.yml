name: package

# 跨平台构建与界面检查。当前只验证「能编译 + 能出图」，安装包打包尚未实现（见 TODO.md）。
# 每个平台跑一次 offscreen 渲染，产物是一张 ui-screenshot.png，用来肉眼核对跨平台布局。

on:
  push:
    branches:
      - master
      - 'inotfrk-*-Main'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            artifact: linux-screenshot
          - name: windows
            os: windows-latest
            artifact: windows-screenshot
          - name: macos
            os: macos-14
            artifact: macos-screenshot
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          cache: true

      # Qt Quick 的 offscreen 平台不依赖显示器，但仍要 xcb / OpenGL 的动态库。
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libgl1-mesa-dri libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            fonts-wqy-zenhei

      - name: Build and screenshot (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build.ps1 -Task test -Headless

      - name: Build and screenshot (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build.sh test

      - name: Collect screenshot
        shell: bash
        run: |
          mkdir -p dist
          cp build/ui-screenshot.png dist/ui-screenshot.png
          ls -l dist

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/ui-screenshot.png
          if-no-files-found: error
          retention-days: 14
